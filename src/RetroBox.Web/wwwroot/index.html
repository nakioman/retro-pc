<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetroBox</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-mark">RB</span>
    <div>
      <h1>RetroBox</h1>
      <p class="subtitle" data-i18n="subtitle"></p>
    </div>
  </div>
  <div class="header-tools">
    <input type="search" id="search" data-i18n-placeholder="searchPlaceholder">
    <select id="language" aria-label="Language">
      <option value="es">Espanol</option>
      <option value="en">English</option>
    </select>
  </div>
</header>

<main>
  <section class="card drop">
    <h2 data-i18n="uploadTitle"></h2>
    <p class="hint" data-i18n="uploadHint"></p>
    <input type="file" id="file" accept=".img,.ima,.dsk" multiple hidden>
    <button id="pick" class="primary" data-i18n="uploadButton"></button>
    <p id="upload-status" class="hint" role="status"></p>
  </section>

  <section class="card drive" id="drive" hidden>
    <div class="card-head">
      <h2 data-i18n="driveTitle"></h2>
      <span id="drive-state" class="hint"></span>
    </div>
    <p id="drive-detail" class="hint"></p>
    <div class="actions" id="assign" hidden>
      <select id="assign-target" aria-label="Floppy"></select>
      <button id="assign-write" class="primary" data-i18n="assignButton"></button>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2 data-i18n="libraryTitle"></h2>
      <div class="actions">
        <span id="stats" class="hint"></span>
        <button id="game-create-toggle" data-i18n="gameCreate"></button>
      </div>
    </div>
    <form id="game-create" class="game-create" hidden>
      <p class="hint" data-i18n="gameCreatePrompt"></p>
      <label><span data-i18n="gameId"></span><input id="game-id" name="id" required></label>
      <label><span data-i18n="gameLabel"></span><input id="game-label" name="label" required></label>
      <button class="primary" type="submit" data-i18n="gameCreate"></button>
    </form>
    <p id="catalog-error" class="error" role="alert" hidden></p>
    <p id="library-error" class="error" role="alert" hidden></p>
    <div id="library" class="library"></div>
    <p id="empty" class="hint" data-i18n="empty" hidden></p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
