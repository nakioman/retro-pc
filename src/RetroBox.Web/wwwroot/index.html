<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetroBox</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-mark">RB</span>
    <div>
      <h1>RetroBox</h1>
      <p class="subtitle" data-i18n="subtitle"></p>
    </div>
  </div>
  <div class="header-tools">
    <input type="search" id="search" data-i18n-placeholder="searchPlaceholder">
    <button id="settings-open" class="icon-button" type="button" data-i18n-title="settings" aria-label="Settings">⚙</button>
  </div>
</header>

<main id="library-view">
  <section class="card drop">
    <h2 data-i18n="uploadTitle"></h2>
    <p class="hint" data-i18n="uploadHint"></p>
    <input type="file" id="file" accept=".img,.ima,.dsk" multiple hidden>
    <button id="pick" class="primary" data-i18n="uploadButton"></button>
    <p id="upload-status" class="hint" role="status"></p>
  </section>

  <section class="card drive" id="drive" hidden>
    <div class="card-head">
      <h2 data-i18n="driveTitle"></h2>
      <span id="drive-state" class="hint"></span>
    </div>
    <p id="drive-detail" class="hint"></p>
    <div class="actions" id="assign" hidden>
      <select id="assign-target" aria-label="Floppy"></select>
      <button id="assign-write" class="primary" data-i18n="assignButton"></button>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2 data-i18n="libraryTitle"></h2>
      <div class="actions">
        <span id="stats" class="hint"></span>
        <button id="game-create-toggle" data-i18n="gameCreate"></button>
      </div>
    </div>
    <form id="game-create" class="game-create" hidden>
      <p class="hint" data-i18n="gameCreatePrompt"></p>
      <label><span data-i18n="gameId"></span><input id="game-id" name="id" required></label>
      <label><span data-i18n="gameLabel"></span><input id="game-label" name="label" required></label>
      <button class="primary" type="submit" data-i18n="gameCreate"></button>
    </form>
    <p id="catalog-error" class="error" role="alert" hidden></p>
    <p id="library-error" class="error" role="alert" hidden></p>
    <div id="library" class="library"></div>
    <p id="empty" class="hint" data-i18n="empty" hidden></p>
  </section>
</main>

<main id="settings-view" class="settings-view" hidden>
  <div class="settings-header">
    <button id="settings-back" type="button" data-i18n="back"></button>
    <h2 data-i18n="settings"></h2>
  </div>
  <section class="card settings-card">
    <label class="setting-field"><span data-i18n="language"></span>
      <select id="language" aria-label="Language">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </label>
  </section>
  <form id="scraper-settings" class="card settings-card">
    <div class="card-head">
      <div>
        <h2 data-i18n="scraperTitle"></h2>
        <p class="hint" data-i18n="scraperHint"></p>
      </div>
      <span id="scraper-status" class="hint" role="status"></span>
    </div>
    <div id="scraper-flags" class="scraper-flags" aria-live="polite"></div>
    <div class="credential-grid">
      <label class="setting-field"><span data-i18n="devId"></span><input id="dev-id" name="devId" autocomplete="off"></label>
      <label class="setting-field"><span data-i18n="devPassword"></span><input id="dev-password" name="devPassword" type="password" autocomplete="new-password"></label>
      <label class="setting-field"><span data-i18n="ssId"></span><input id="ss-id" name="ssId" autocomplete="off"></label>
      <label class="setting-field"><span data-i18n="ssPassword"></span><input id="ss-password" name="ssPassword" type="password" autocomplete="new-password"></label>
    </div>
    <div class="priority-grid">
      <section><h3 data-i18n="regionPriority"></h3><div id="region-priority" class="priority-list"></div></section>
      <section><h3 data-i18n="languagePriority"></h3><div id="language-priority" class="priority-list"></div></section>
    </div>
    <div class="credential-grid">
      <label class="setting-field"><span data-i18n="requestTimeout"></span><input id="request-timeout" name="requestTimeoutSeconds" type="number" min="5" max="600"></label>
      <label class="setting-field"><span data-i18n="maxDownload"></span><input id="max-download" name="maxDownloadMegabytes" type="number" min="1" max="64"></label>
    </div>
    <p id="scraper-error" class="error" role="alert" hidden></p>
    <div class="actions">
      <button id="scraper-save" class="primary" type="submit" data-i18n="save"></button>
      <button id="scraper-test" type="button" data-i18n="testCredentials"></button>
    </div>
  </form>
</main>

<script src="app.js"></script>
</body>
</html>
