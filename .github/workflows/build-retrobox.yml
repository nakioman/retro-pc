name: Build RetroBox

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "RetroBox.slnx"
      - "mise.toml"
      - ".github/workflows/build-retrobox.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "RetroBox.slnx"
      - "mise.toml"
      - ".github/workflows/build-retrobox.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Publish Linux x64 binary
        run: mise run publish-linux-x64

      - name: Upload RetroBox artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrobox-linux-x64
          path: src/RetroBox.Cli/bin/Release/net10.0/linux-x64/publish/retrobox
          if-no-files-found: error
          retention-days: 14
