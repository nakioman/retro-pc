name: Build RetroBox

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "RetroBox.slnx"
      - "mise.toml"
      - ".github/workflows/build-retrobox.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "RetroBox.slnx"
      - "mise.toml"
      - ".github/workflows/build-retrobox.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Run tests
        run: mise run test

      - name: Install Native AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev binutils

      - name: Publish Linux x64 binary
        run: mise run publish-linux-x64

      - name: Smoke test published binary
        run: |
          set -euo pipefail
          artifact="src/RetroBox.Cli/bin/Release/net10.0/linux-x64/publish/retrobox"
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/vms/386sx16" "$fixture/vms/pentium100"
          touch "$fixture/vms/386sx16/86box.cfg" "$fixture/vms/pentium100/86box.cfg"
          printf '%s\n' \
            'vms:' \
            '  386sx16:' \
            '    label: "386SX-16"' \
            "    path: \"$fixture/vms/386sx16\"" \
            '  pentium100:' \
            '    label: "Pentium 100"' \
            "    path: \"$fixture/vms/pentium100\"" \
            > "$fixture/vms.yaml"
          "$artifact" --help
          "$artifact" boot --dry-run --config-root "$fixture" --select 386sx16
          "$artifact" boot --dry-run --config-root "$fixture" --select pentium100
          test ! -e "$fixture/config.yaml"

      - name: Upload RetroBox artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrobox-linux-x64
          path: src/RetroBox.Cli/bin/Release/net10.0/linux-x64/publish/retrobox
          if-no-files-found: error
          retention-days: 14
