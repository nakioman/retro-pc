name: Build Debian appliance installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'appliance/**'
      - 'profiles/**'
      - 'src/**'
      - 'mise.toml'
      - '.github/workflows/build-appliance-installer.yml'

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - name: Install ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes debconf-utils xorriso
      - run: debconf-set-selections -c appliance/installer/preseed.cfg
      - run: mise run test
      - run: ./appliance/installer/build-installer.sh
      - name: Publish build summary
        run: |
          {
            echo '## Debian appliance installer'
            echo
            echo '- 86Box version: `'"$(awk -F'"' '/"86box_version"/ {print $4; exit}' build/retro-pc-installer.iso.json)"'`'
            echo "- SHA-256: \`$(awk '{print $1}' build/retro-pc-installer.iso.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: retro-pc-debian-installer-${{ github.sha }}
          path: |
            build/retro-pc-installer.iso
            build/retro-pc-installer.iso.sha256
            build/retro-pc-installer.iso.json
          if-no-files-found: error
          retention-days: 7
