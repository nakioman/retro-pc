name: Build USB appliance installer

on:
  push:
    branches: [main]
    paths:
      - "appliance/**"
      - ".github/workflows/build-usb-installer.yml"
  pull_request:
    paths:
      - "appliance/**"
      - ".github/workflows/build-usb-installer.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint installer shell scripts
        # -x follows the sourced lib/*.sh from install-retropc.sh, so the whole
        # installer is linted with cross-file variable resolution. Linting the
        # libs standalone would false-flag their shared vars as unused.
        run: |
          shellcheck -x -P SCRIPTDIR -S style \
            appliance/installer/build-usb-installer.sh \
            appliance/installer/install-retropc.sh

  build:
    needs: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest successful RetroBox build from main
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build-retrobox.yml
          workflow_conclusion: success
          branch: main
          name: retrobox-linux-x64
          path: .artifacts/retrobox
          search_artifacts: true

      - name: Install Debian image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap squashfs-tools xorriso \
            isolinux syslinux-common dosfstools \
            debian-archive-keyring zstd xz-utils e2fsprogs file curl

      - name: Build installer image
        env:
          RETROBOX_BIN: ${{ github.workspace }}/.artifacts/retrobox/retrobox
        run: sudo -E bash appliance/installer/build-usb-installer.sh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: retropc-installer-iso
          path: appliance/installer/out/retropc-installer.iso
          if-no-files-found: error
          retention-days: 14

  release:
    # Publish a GitHub Release with the ISO only for pushes to main (or a manual
    # run on main). PR builds still just upload the artifact above.
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: retropc-installer-iso
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="appliance-$(date -u +%Y%m%d)-${{ github.run_number }}"
          ISO="dist/retropc-installer-${TAG}.iso"
          mv dist/retropc-installer.iso "$ISO"

          # Previous release tag: the second-most-recent GitHub release; fall back
          # to the newest prior git tag if only one release exists so far.
          PREV_TAG="$(gh release list --limit 2 --json tagName --jq '.[1].tagName' 2>/dev/null || true)"
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="$(git tag --sort=-creatordate | sed -n '2p' || true)"
          fi

          {
            echo "Automated bootable USB appliance installer built from ${{ github.sha }}."
            echo
            echo "Flash to a USB and boot the retro PC:"
            echo '```'
            echo "sudo dd if=$(basename "$ISO") of=/dev/sdX bs=4M status=progress"
            echo '```'
            echo
            if [ -z "$PREV_TAG" ]; then
              echo "## Changes"
              echo
              echo "- Initial release."
            else
              echo "## Changes since $PREV_TAG"
              echo
              git log --no-merges --pretty=format:'%s' "$PREV_TAG..HEAD" | sort -u \
                | awk '
                    /^feat/ { feat = feat "- " $0 "\n"; next }
                    /^fix/  { fix  = fix  "- " $0 "\n"; next }
                    { other = other "- " $0 "\n" }
                    END {
                      if (feat)  { print "### Features";  print feat }
                      if (fix)   { print "### Fixes";     print fix }
                      if (other) { print "### Other";     print other }
                    }'
            fi
          } > notes.md
          gh release create "$TAG" "$ISO" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "RetroBox appliance installer ${TAG}" \
            --notes-file notes.md
