name: Build USB appliance installer

on:
  push:
    branches: [main]
    paths:
      - "appliance/**"
      - "src/**"
      - "tests/**"
      - "RetroBox.slnx"
      - "mise.toml"
      - ".github/workflows/build-usb-installer.yml"
  pull_request:
    paths:
      - "appliance/**"
      - "src/**"
      - "tests/**"
      - "RetroBox.slnx"
      - "mise.toml"
      - ".github/workflows/build-usb-installer.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint installer shell scripts
        # -x follows the sourced lib/*.sh from install-retropc.sh, so the whole
        # installer is linted with cross-file variable resolution. Linting the
        # libs standalone would false-flag their shared vars as unused.
        run: |
          shellcheck -x -P SCRIPTDIR -S style \
            appliance/installer/build-usb-installer.sh \
            appliance/installer/install-retropc.sh

  # Reuse the .NET build workflow so the ISO always embeds the exact code at
  # the tested commit, not a previously published artifact.
  retrobox-build:
    uses: ./.github/workflows/build-retrobox.yml

  build:
    needs: [shellcheck, retrobox-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download RetroBox binary from the reusable build
        uses: actions/download-artifact@v4
        with:
          name: retrobox-linux-x64
          path: .artifacts/retrobox

      - name: Install Debian image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap squashfs-tools xorriso \
            isolinux syslinux-common dosfstools \
            debian-archive-keyring zstd xz-utils e2fsprogs file curl

      - name: Build installer image
        env:
          RETROBOX_BIN: ${{ github.workspace }}/.artifacts/retrobox/retrobox
        run: sudo -E bash appliance/installer/build-usb-installer.sh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: retropc-installer-iso
          path: appliance/installer/out/retropc-installer.iso
          if-no-files-found: error
          retention-days: 14

  release:
    # Publish a GitHub Release with the ISO only for pushes to main (or a manual
    # run on main). PR builds still just upload the artifact above.
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: retropc-installer-iso
          path: dist

      - name: Compute release tag and detect previous release tag
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="appliance-$(date -u +%Y%m%d)-${{ github.run_number }}"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

          # Previous release tag: the most recent prior GitHub release. Falls
          # back to the newest prior git tag if the release API is unavailable,
          # but only matching tags produced by this workflow (so orphan tags
          # from failed runs are ignored).
          PREV_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="$(git tag --sort=-creatordate --list 'appliance-*' | sed -n '1p' || true)"
          fi
          if [ -n "$PREV_TAG" ]; then
            echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        id: notes
        if: steps.prev.outputs.tag != ''
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: COMMIT
          fromTag: ${{ steps.prev.outputs.tag }}
          # Pass the SHA being released, NOT the future release tag. The compare
          # API call the action makes against `toTag` 404s when the tag doesn't
          # exist remotely yet (this workflow is the one creating it).
          toTag: ${{ github.sha }}
          failOnError: true
          configurationJson: |
            {
              "categories": [
                {
                  "title": "Features",
                  "label_extractor": [{"pattern": "^feat(?:\\([^)]+\\))?!?:", "on_property": "title"}]
                },
                {
                  "title": "Fixes",
                  "label_extractor": [{"pattern": "^fix(?:\\([^)]+\\))?!?:", "on_property": "title"}]
                }
              ],
              "uncategorized": {"title": "Other"},
              "sort": "ASC",
              "ignore_labels": ["skip-changelog"],
              "duplicate_filter": true
            }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
          RELEASE_TAG: ${{ steps.prev.outputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          ISO="dist/retropc-installer-${TAG}.iso"
          mv dist/retropc-installer.iso "$ISO"

          {
            echo "Automated bootable USB appliance installer built from ${{ github.sha }}."
            echo
            echo "Flash to a USB and boot the retro PC:"
            echo '```'
            echo "sudo dd if=$(basename "$ISO") of=/dev/sdX bs=4M status=progress"
            echo '```'
            echo
            if [ -z "$PREV_TAG" ]; then
              echo "## Changes"
              echo
              echo "- Initial release."
            else
              echo "## Changes since $PREV_TAG"
              echo
              echo "${{ steps.notes.outputs.changelog }}"
            fi
          } > notes.md
          gh release create "$TAG" "$ISO" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "RetroBox appliance installer ${TAG}" \
            --notes-file notes.md
