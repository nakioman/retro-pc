# openspec/config.yaml — retro-pc (RetroBox)
schema: spec-driven

context: |
  Tech stack: .NET 10 (C#), solution RetroBox.slnx; projects src/RetroBox.Cli,
    src/RetroBox.Core, src/RetroBox.Daemon; tests/RetroBox.Tests (xUnit).
  Architecture: Core = domain (config store, catalog, boot selection, floppy
    import/control client, Arduino serial protocol, YAML models); Cli =
    System.CommandLine entry; Daemon = floppy event handler. Flat
    file-per-concern classes with RetroBox* prefix. Firmware (ESP8266 Arduino)
    and appliance (Debian USB installer) live outside the solution.
  Testing: mise run test -> dotnet test RetroBox.slnx (117 xUnit tests,
    verified passing). coverlet.collector available for coverage. CI publishes
    Native AOT (publish-linux-x64) and smoke-tests the binary.
  Style: C# 13, nullable enable, implicit usings; English artifacts;
    conventional commits. Use `mise run <task>` — never `dotnet` directly.

rules:
  proposal:
    - Keep scope small; state intent, scope, and approach
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
    - Include sequence diagrams for complex flows
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing RetroBox* naming and file-per-concern patterns
      - Use mise tasks; do not invoke dotnet directly
    tdd: true           # RED-GREEN-REFACTOR: write failing test first
    test_command: "mise run test"
  verify:
    test_command: "mise run test"
    build_command: "mise run publish-linux-x64"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
