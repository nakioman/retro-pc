[General]
vid_renderer = sdl
emu_build_dynarec_type = new
floppy_control_socket_enabled = 1
floppy_control_socket_path = /run/retrobox/86box-floppy.sock
mouse_auto_capture = 1
start_in_fullscreen = 1
gpio_active_low = 1
gpio_enabled = 1
gpio_hdd_pin = 360
gpio_device = /dev/gpiochip0

[GL3 Shaders]
shaders = 1
shader0 = /opt/86Box/shaders/crt/crt-easymode.glslp

[GL3 Shaders - crt-easymode.glslp]
SCANLINE_CUTOFF = 700
SCANLINE_BRIGHT_MIN = 0.55
SCANLINE_BRIGHT_MAX = 0.75
MASK_SIZE = 2
MASK_STRENGTH = 0.30
MASK_STAGGER = 3
MASK_DOT_HEIGHT = 2
SHARPNESS_H = 1.0
GAMMA_INPUT = 2.4
BRIGHT_BOOST = 1.25

[Machine]
cpu_family = pentium2_deschutes
cpu_multi = 3.5
cpu_speed = 350000000
cpu_use_dynarec = 1
fpu_type = internal
machine = p2bls
mem_size = 131072
pit_mode = 1

[Video]
gfxcard = voodoo3_3k_agp
monitor_edid = 1
monitor_edid_path = /data/vms/pentium2-350/syncmaster3.edid

[Input devices]
keyboard_type = keyboard_ps2
mouse_type = ps2
tablet_type = none

[PS/2 Mouse]
buttons = 4

[Sound]
sndcard = sbawe64_gold

[Network]
net_01_link = 0
net_02_link = 0
net_03_link = 0
net_04_link = 0

[Hard disks]
hdd_01_fn = hdd.raw
hdd_01_ide_channel = 0:0
hdd_01_parameters = 63, 255, 2434, 0, ide
hdd_01_speed = 1998_5400rpm

[Floppy and CD-ROM drives]
cdrom_01_ide_channel = 1:0
cdrom_01_parameters = 1, atapi
cdrom_01_speed = 72
cdrom_01_type = 86dvd
fdd_01_audio = alps_df354h148f_80t
fdd_01_type = 35_2hd
fdd_02_type = none
fdd_host_buffering = 1
