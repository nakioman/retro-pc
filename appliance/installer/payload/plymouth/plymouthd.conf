# RetroBox boot splash configuration.
# Installed to /etc/plymouth/plymouthd.conf on the target.
#
# Goal: a quiet appliance boot with a simple loading indicator instead of a
# wall of kernel/systemd text. "spinner" ships with base plymouth and renders a
# minimal throbber + progress on the 1280x960 framebuffer that GRUB hands off
# (GRUB_GFXPAYLOAD_LINUX=keep). To use a different look, install a theme from
# the plymouth-themes package and set Theme below (e.g. bgrt, solar, tribar),
# then re-run `update-initramfs -u` and `plymouth-set-default-theme`.
[Daemon]
Theme=spinner
