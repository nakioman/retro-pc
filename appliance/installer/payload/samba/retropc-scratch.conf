# RetroBox Samba scratch share.
# Installed to /etc/samba/smb.conf on the target (this is the whole config for
# the appliance: a single drop folder, nothing else on /data is exported).
#
# Only /data/floppies/scratch is shared. retrobox moves imported images out of
# scratch into /data/floppies/cataloged/, which is NOT network-accessible.
[global]
   workgroup = WORKGROUP
   server string = RetroBox
   server role = standalone server
   map to guest = Bad User
   log file = /var/log/samba/log.%m
   max log size = 1000
   # Appliance LAN drop share; no printers, no home shares.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[scratch]
   comment = RetroBox floppy import drop folder
   path = /data/floppies/scratch
   browseable = yes
   read only = no
   guest ok = yes
   force user = retrobox
   force group = retrobox
   create mask = 0664
   directory mask = 0775
