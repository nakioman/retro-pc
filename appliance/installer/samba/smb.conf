[global]
   server role = standalone server
   map to guest = never
   disable netbios = yes
   smb ports = 445

[retro-floppy-scratch]
   comment = Restricted RetroBox floppy import drop folder
   path = /data/floppies/scratch
   browseable = yes
   guest ok = no
   read only = no
   valid users = @retrobox-samba
   force group = retrobox-samba
   create mask = 0660
   directory mask = 0770
