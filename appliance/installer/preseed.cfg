# Debian 13 (trixie) installer defaults for the BIOS-only Retro PC appliance.
# Disk selection, destructive confirmation, hostname, user credentials, and
# timezone remain interactive by design.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i mirror/suite string trixie

# Bring up the installer network automatically, but show the appliance name
# and timezone defaults to the operator before continuing.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string retrobox
d-i netcfg/get_hostname seen false
d-i time/zone string Etc/UTC
d-i time/zone seen false

# Do not set partman-auto/disk or any partman confirmation values: the
# operator must select and explicitly approve the disk to erase.
d-i partman-partitioning/default_label string msdos
d-i partman-auto/method string regular
d-i partman/default_filesystem string ext4
d-i partman-auto/expert_recipe string \
    retrobox :: \
        32768 65536 65536 ext4 \
            $primary{ } $bootable{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ / } \
        . \
        1024 8192 -1 ext4 \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /data } \
        .
d-i partman/mount_style select uuid

# Install GRUB to the MBR of the disk chosen by partman.
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Keep the base system headless while installing the appliance's maintenance,
# file-sharing, audio, and network-management dependencies.
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server sudo samba alsa-utils pulseaudio-utils network-manager
d-i pkgsel/upgrade select none
d-i popularity-contest/participate boolean false

d-i preseed/late_command string /cdrom/retropc/install-retropc.sh
