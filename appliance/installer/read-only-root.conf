# RetroBox read-only root support
#
# install-retropc.sh writes UUID-backed root and /data fstab entries, then adds
# tmpfs mounts for /tmp and /var/log. systemd already provides /run as a
# runtime tmpfs. Persistent state for enabled services is bind-mounted from:
#
# /data/system-state/samba -> /var/lib/samba
# /data/system-state/network-manager -> /var/lib/NetworkManager
#
# Root is only changed to read-only after the boot service, Samba configuration,
# and this support file have been installed.
#
# Recovery: run `/usr/local/sbin/install-retropc.sh --maintenance` as an
# administrator to remount the installed root read-write. To stop fullscreen
# launch for a normal maintenance boot, run `systemctl edit retrobox-boot.service`
# and add:
#
# [Service]
# Environment=RETROBOX_MAINTENANCE=1
#
# Remove the override with `systemctl revert retrobox-boot.service` when the
# appliance should return to its normal fullscreen boot behavior. When
# maintenance is complete, run `mount -o remount,ro /` before rebooting.
