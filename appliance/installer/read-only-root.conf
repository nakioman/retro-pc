# RetroBox read-only root support
#
# install-retropc.sh writes UUID-backed root and /data fstab entries, then adds
# tmpfs mounts for /tmp, /var/log, and /var/lib/retrobox. systemd already
# provides /run as a runtime tmpfs. Root is only changed to read-only after the
# boot service, Samba configuration, and this support file have been installed.
#
# Recovery: boot with `systemd.unit=multi-user.target`, then run
# `mount -o remount,rw /` as an administrator. To stop fullscreen launch for a
# normal maintenance boot, run `systemctl edit retrobox-boot.service` and add:
#
# [Service]
# Environment=RETROBOX_MAINTENANCE=1
#
# Remove the override with `systemctl revert retrobox-boot.service` when the
# appliance should return to its normal fullscreen boot behavior.
