# dpkg path filters for the target rootfs (passed to mmdebstrap --dpkgopt).
# mesa-vulkan-drivers ships every Mesa Vulkan driver (~80 MB); the appliance's
# Intel iGPU only needs ANV, so keep libvulkan_intel.so and its ICD manifest.
path-exclude=/usr/lib/x86_64-linux-gnu/libvulkan_*.so
path-include=/usr/lib/x86_64-linux-gnu/libvulkan_intel.so
path-exclude=/usr/share/vulkan/icd.d/*
path-include=/usr/share/vulkan/icd.d/intel_icd.json
