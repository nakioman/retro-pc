[tools]
dotnet = "10"
"aqua:arduino/arduino-cli" = "1.5.1"

[tasks.restore]
description = "Restore .NET dependencies"
run = "dotnet restore RetroBox.slnx"

[tasks.test]
description = "Run the .NET test suite"
run = "dotnet test RetroBox.slnx"

[tasks.format]
description = "Apply dotnet formatting rules to the solution"
run = "dotnet format RetroBox.slnx"

[tasks.format-check]
description = "Verify formatting compliance without changing files"
depends = ["restore"]
run = "dotnet format RetroBox.slnx --verify-no-changes --no-restore"

[tasks.cli]
description = "Run the retrobox CLI from source"
raw_args = true
run = "dotnet run --project src/RetroBox.Cli/RetroBox.Cli.csproj --"

[tasks.publish-linux-x64]
description = "Publish retrobox as a Linux x64 Native AOT binary"
run = "dotnet publish src/RetroBox.Cli/RetroBox.Cli.csproj -c Release -r linux-x64 -p:PublishAot=true -warnaserror"

[tasks.firmware-compile]
description = "Compile the ESP8266 firmware"
run = "arduino-cli compile firmware/retrofloppy-esp8266"

[tasks.firmware-upload]
description = "Compile and upload the ESP8266 firmware"
depends = ["firmware-compile"]
raw_args = true
run = "arduino-cli upload --fqbn esp8266:esp8266:nodemcuv2 firmware/retrofloppy-esp8266 -p"

[tasks.nfc-test]
description = "Exercise the floppy controller NFC path over the serial line"
raw_args = true
run = "scripts/retrofloppy-nfc-test.sh"

[tasks.floppy-stl]
description = "Render the printable NFC floppy to STL"
run = "openscad -o hardware/floppy-nfc-blank/floppy-nfc.stl hardware/floppy-nfc-blank/floppy-nfc.scad"
